services:
  - type: web
    name: cricket-hub-backend
    env: node
    plan: free
    rootDir: backend

    buildCommand: npm install
    startCommand: npm start

    envVars:
      - key: MONGO_URL
        sync: false

      - key: DB_NAME
        value: cricket_league

      - key: JWT_SECRET
        sync: false

      - key: FRONTEND_URL
        sync: false

      - key: GEMINI_API_KEY
        sync: false

      - key: GOOGLE_CLIENT_ID
        value: 473404359350-1jpjmc0g7gndo014ebhkjjbkhu9eouko.apps.googleusercontent.com

      - key: GOOGLE_CLIENT_SECRET
        sync: false

      - key: PORT
        value: "10000"